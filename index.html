<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExpressMart HN — Asistente virtual</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="avatar">EM</div>
      <div class="title"><strong>ExpressMart HN</strong><span>Asistente virtual · en línea 24/7</span></div>
      <button id="clear" class="clear" title="Limpiar conversación">🗑 Limpiar</button>
    </header>
    <div class="notice">🔒 No escribas datos de tarjeta, contraseñas ni datos personales. Para tu pedido solo necesito el número (ej. EM-1042).</div>
    <section id="messages" class="messages" aria-live="polite"></section>
    <div class="chips" id="chips">
      <button data-q="¿Cuál es el horario de la tienda?">🕒 Ver horarios</button>
      <button data-q="Quiero consultar mi pedido EM-">📦 Consultar pedido</button>
      <button data-q="¿Qué productos y precios tienen?">💰 Ver precios</button>
      <button data-q="¿Cuánto cuesta el envío?">🛵 Envío</button>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" maxlength="500" placeholder="Escribe tu pregunta…" aria-label="Escribe tu pregunta"></textarea>
      <button id="send">Enviar</button>
    </div>
  </main>
  <script src="retrieval.js"></script>
  <script src="app.js"></script>
</body>
</html>
